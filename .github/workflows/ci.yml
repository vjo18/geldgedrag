name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate static website
        run: python3 tools/check_site.py
      - name: Check JavaScript syntax
        run: |
          for file in docs/*.js; do
            node --check "$file"
          done
